<!DOCTYPE html>
<html>
<head>
    <title>Add Two Numbers</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin-top: 50px;
            text-align: center;
        }
        form {
            display: inline-block;
            padding: 20px;
            border: 2px solid #ccc;
            border-radius: 10px;
        }
        input {
            padding: 8px;
            margin: 10px;
            width: 150px;
        }
        .result {
            font-size: 1.2em;
            margin-top: 20px;
            color: green;
        }
    </style>
</head>
<body>
    <h1>Simple Adder</h1>
    <form action="/add" method="POST">
        <input type="text" name="a" placeholder="Enter first number" required><br>
        <input type="text" name="b" placeholder="Enter second number" required><br>
        <button type="submit">Add</button>
    </form>
    
    {% if result is not none %}
    <div class="result">
        <strong>Result: {{ result }}</strong>
    </div>
    {% endif %}
</body>
</html>
